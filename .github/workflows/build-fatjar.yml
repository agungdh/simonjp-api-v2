name: Build Fat JAR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build uber-jar
        run: ./gradlew build -Dquarkus.package.jar.type=uber-jar

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: simonjp-api-v2-fatjar
          path: build/*-runner.jar
